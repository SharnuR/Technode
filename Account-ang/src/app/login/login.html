<div class="login-wrapper">
  <div class="card">
    <div class="card-header">Login</div>

    <div class="card-body">
      <form #loginForm="ngForm" class="form" (ngSubmit)="login(loginForm)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" [(ngModel)]="loginData.username" name="loginData.username" id="username"
            placeholder="enter name.." #username="ngModel" minlength="3" required />

          <app-form-errors [control]="username.control" fieldName="User name" [minLength]="3"></app-form-errors>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" [(ngModel)]="loginData.password" name="loginData.password" id="password"
            placeholder="enter password.." #password="ngModel" minlength="3" required />
          <app-form-errors [control]="password.control" fieldName="Password" [minLength]="3"></app-form-errors>
        </div>

        <button class="btn btn-primary my-1" type="submit">Submit</button>

        <p class="m-0 register-forgot">
          <a class="link" (click)="forgotPwd()">Forgot!</a>
          <a class="link" (click)="register()">Register</a>
        </p>
      </form>
    </div>
  </div>
</div>
