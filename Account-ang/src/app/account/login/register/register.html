<div class="register-wrapper d-flex justify-content-center">
  <div class="card">
    <div class="card-header">Register</div>

    <div class="card-body">
      <form #registerForm="ngForm" (ngSubmit)="register(registerForm)">
        <div class="form-group d-flex flex-column">
          <label for="email"> User name</label>
          <input type="text" id="email" name="email" [ngModel]="user.email"
            (ngModelChange)="onFieldChange('email', $event)" #email="ngModel" minlength="3" required />

          <app-form-errors [control]="email.control" fieldName="email" [minLength]="3"></app-form-errors>
        </div>

        <div class="form-group d-flex flex-column">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" [ngModel]="user.password"
            (ngModelChange)="onFieldChange('password', $event)" #password="ngModel" minlength="3" required />

          <app-form-errors [control]="password.control" fieldName="password" [minLength]="3"></app-form-errors>
        </div>

        <div class="form-group d-flex flex-column">
          <label for="confirmPwd">Confirm Password</label>
          <input type="password" id="confirmPwd" name="confirmPwd" [ngModel]="user.confirmPwd"
            (ngModelChange)="onFieldChange('confirmPwd', $event)" #confirmPwd="ngModel" minlength="3" required />
          <app-form-errors [control]="confirmPwd.control" fieldName="confirmPwd" [minLength]="3"></app-form-errors>
        </div>

        <button class="btn btn-primary my-1" type="submit">Submit</button>

        <div>Link: {{ links }}</div>
      </form>
    </div>
  </div>
</div>
